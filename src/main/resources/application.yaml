spring:
  application:
    name: ticket-on-server

  profiles:
    default: local

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 1s

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 30m
  refresh-expiration: 14d

cookie:
  secure: true
