services:
  mysql:
    image: mysql:8.0
    container_name: ticket-on-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: ticket-on-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  mysql-data: